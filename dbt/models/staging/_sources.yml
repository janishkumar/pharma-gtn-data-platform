version: 2

sources:
  - name: raw
    description: All-varchar Parquet written by `gtn ingest`, one folder per source.
    meta:
      external_location: "read_parquet('{{ env_var('GTN_DATA_DIR') }}/raw/{name}/*.parquet', union_by_name=true)"
    tables:
      - name: sdud
        description: CMS State Drug Utilization Data, one file per year.
      - name: nadac
        description: National Average Drug Acquisition Cost, one file per year (weekly snapshots).
      - name: ful
        description: ACA Federal Upper Limits, monthly, with weighted average of AMPs.
      - name: drug_products
        description: Drug Products in the Medicaid Drug Rebate Program, quarterly snapshots.
      - name: cms64
        description: Medicaid Financial Management Data (CMS-64), national totals.
      - name: cpi_u
        description: BLS CPI-U all items, US city average, not seasonally adjusted (CUUR0000SA0).
