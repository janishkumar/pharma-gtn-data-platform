name: gtn
version: "0.1.0"
config-version: 2
profile: gtn

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Dispute thresholds (design section 6)
  uom_multiple: 10          # units/Rx above this multiple of the NDC-quarter national median
  price_ratio_low: 0.1      # Medicaid paid per unit below this share of NADAC: units overstated
  # Units/Rx imputed for a suppressed row (CMS suppresses rows under 11 prescriptions)
  suppressed_max_rx: 10

models:
  gtn:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  gtn:
    rebate_scenarios:
      +column_types:
        scenario: varchar
        amp_nadac_factor: double
        bp_discount: double
        pre_nadac_excess_growth: double
        is_base: boolean
