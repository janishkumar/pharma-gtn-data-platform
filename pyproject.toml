[project]
name = "pharma-gtn-data-platform"
version = "0.1.0"
description = "Medicaid rebate liability estimates, invoice dispute flags and a CMS-64 check, built from public CMS data with dbt and DuckDB."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Janish Kumar" }]
dependencies = [
    "duckdb>=1.1,<2",
    "httpx>=0.27",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Source = "https://github.com/janishkumar/pharma-gtn-data-platform"

[project.scripts]
gtn = "gtn_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtn_platform"]

[tool.hatch.build.targets.sdist]
include = ["src/gtn_platform", "tests", "dbt", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
